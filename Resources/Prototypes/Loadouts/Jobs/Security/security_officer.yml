# Senior Time
- type: loadoutEffectGroup
  id: SeniorOfficer
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobWarden
      time: 6h
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:DepartmentTimeRequirement
      department: Security
      time: 60h

# Head
- type: loadout
  id: SecurityHelmet
  equipment:
    head: erisport_operator_helmet

- type: loadout
  id: SecurityHat
  equipment:
