# Club civilian jobs (Eris code/game/jobs/job/civilian.dm + assistant.dm).
# Unique prototype IDs keep upstream Bartender / ServiceWorker / Passenger free to evolve.
# Eris access list -> fork mapping lives in _Oxyd/Club/access.yml comments.
# Clothing sprites already live under erisPorted/; Artist's Bench / insight perks are follow-up.

# ---------------------------------------------------------------------------
# Club Manager — Eris /datum/job/clubmanager (bartender outfit + manager jacket)
# ---------------------------------------------------------------------------
- type: job
  id: ClubManager
  name: job-name-club-manager
  description: job-description-club-manager
  playTimeTracker: JobClubManager
  requirements:
  - !type:DepartmentTimeRequirement
    department: Civilian
    time: 1h
  startingGear: ClubManagerGear
  icon: JobIconClubManager
  supervisors: job-supervisors-hop
  access:
  - Service
  - Bar
  - Kitchen
  - Maintenance
  - OxydClubChange
  - OxydClubArtist

- type: startingGear
  id: ClubManagerGear
  equipment:
    jumpsuit: erisport_bartenders_uniform
    outerClothing: erisport_managers_jacket
    head: ClothingHeadHatTophat
    shoes: ClothingShoesColorBlack
    ears: ClothingHeadsetService
    id: BartenderPDA
  storage:
    back:
    - ShellShotgunBeanbag
    - ShellShotgunBeanbag
    - ShellShotgunBeanbag
    - ShellShotgunBeanbag

- type: chameleonOutfit
  id: ClubManagerChameleonOutfit
  job: ClubManager
  equipment:
    jumpsuit: erisport_bartenders_uniform
    outerClothing: erisport_managers_jacket
    head: ClothingHeadHatTophat
    eyes: ClothingEyesGlassesSunglasses
    neck: ClothingNeckScarfStripedBlack
    gloves: ClothingHandsGlovesColorBlack

# ---------------------------------------------------------------------------
# Club Worker — Eris /datum/job/clubworker (waiter outfit; cook+serve+bounce)
# ---------------------------------------------------------------------------
