# Eris modular_pda shells → Oxyd CartridgeLoader PDAs (sprites from eris_pda.rsi)

- type: entity
  parent: BasePDA
  id: OxydPdaClub
  name: club PDA
  description: Smells faintly of citrus cleaner and spilled amasec.
  components:
  - type: Pda
    id: BartenderIDCard
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-club
  - type: Sprite
    sprite: _Oxyd/Devices/eris_pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda-club"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Icon
    sprite: _Oxyd/Devices/eris_pda.rsi
    state: pda-club
  - type: OxydModularPda
    startingHdd: OxydHwHddSmallAdv
    startingPeripheral: OxydHwPrinter
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    diskSpace: 12
    cartridgeSlot:
      priority: -1
      name: device-pda-slot-component-slot-name-cartridge
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Machines/id_insert.ogg
      whitelist:
        components:
          - Cartridge
  - type: EntityTableContainerFill
    containers:
      preinstalled-program-container: !type:AllSelector
        children:
        - id: CrewManifestCartridge
        - id: NotekeeperCartridge
        - id: NanoTaskCartridge
        - id: NewsReaderCartridge
        - id: OxydTaxQuicklyCartridge
        - id: OxydDrinkCatalogCartridge
        - id: OxydCookCatalogCartridge
        - id: OxydRecordsCartridge
        - id: OxydEmailCartridge
        - id: OxydNtChatCartridge

