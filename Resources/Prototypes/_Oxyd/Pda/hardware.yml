# Eris modular computer_hardware → Oxyd PDA bay parts

- type: entity
  parent: BaseItem
  id: OxydHwCpuSmall
  name: standard microprocessor
  description: Miniaturised CPU for portable devices. Runs two program threads.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpu
  - type: Item
    size: Tiny
  - type: Tag
    tags: [ OxydHwCpu ]
  - type: OxydComputerHardware
    slot: Cpu
    maxPrograms: 2
    powerUsage: 25
    critical: true

- type: entity
  parent: OxydHwCpuSmall
  id: OxydHwCpuAdv
  name: advanced microprocessor
  description: Upgraded portable CPU. Three threads and a spare disk slot.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpu_adv
  - type: OxydComputerHardware
    slot: Cpu
    maxPrograms: 3
    diskBonus: 1
    powerUsage: 40
    critical: true

- type: entity
  parent: OxydHwCpuSmall
  id: OxydHwCpuSuper
  name: photonic microprocessor
  description: Photonic portable CPU. Four threads and two spare disk slots. Hungry.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpu_super
  - type: OxydComputerHardware
    slot: Cpu
    maxPrograms: 4
    diskBonus: 2
    powerUsage: 80
    critical: true

