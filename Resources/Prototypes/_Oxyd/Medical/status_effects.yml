# Analgesics are real status effects: each source is its own entity prototype so doses from
# different sources combine while repeated doses of the same source refresh one instance.
# The Analgesic component carries the suppressed pain amount; MobStatusEffectDebuff removes the
# effect on rejuvenate and blocks it on godmode.
- type: entity
  parent: MobStatusEffectDebuff
  abstract: true
  id: OxydAnalgesicBase
  components:
  - type: Analgesic

- type: entity
  parent: OxydAnalgesicBase
  id: OxydAnalgesicWordsOfPurging
  name: words of purging
  description: Words of purging.

