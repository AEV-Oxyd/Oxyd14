# Eris toxins (code/modules/reagents/reagents/toxins.dm + roach blattedin). Native chems cover
# toxin, amatoxin, carpotoxin, plasma, chlorine, fertilizer trio, plantbgone, pacid, lexorin,
# mutagen, mold, chloralhydrate, slimejelly (Slime), sagent/N2O (NitrousOxide), oil,
# stoxin/soporific (ChloralHydrate per the divergence map). These are the Eris-unique entries.
# "Poison" damage type is Eris toxin; "Cellular" covers organ/genetic damage.
# Roach/spider venoms are harvested in Eris (no chem recipe); their stat buffs map to Stim.

- type: reagent
  id: OxydToxPlasticide
  name: oxyd-reagent-plasticide
  desc: oxyd-reagent-plasticide-desc
  group: Toxins
  physicalDesc: reagent-physical-desc-opaque
  flavor: bitter
  color: "#CF3600"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.01
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 4

- type: reagent
  id: OxydToxCyanide
  name: oxyd-reagent-cyanide
  desc: oxyd-reagent-cyanide-desc
  group: Toxins
  physicalDesc: reagent-physical-desc-translucent
  flavor: bitter
  color: "#CF3600"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.015
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 1.5
            Asphyxiation: 1
            Cellular: 0.5
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        time: 10
        probability: 0.2
      - !type:Vomit
        probability: 0.1

- type: reagent
