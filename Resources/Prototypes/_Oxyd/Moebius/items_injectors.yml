# Eris Moebius injectors. Eris source: code/modules/reagents/reagent_containers/hypospray.dm.
# Eris autoinjectors are single-use 5u hyposprays; empty ones refuse refills in Eris
# (modeled here by giving them inject-only modes and a small internal volume).

- type: entity
  abstract: true
  parent: [ BaseHypoInjector, BaseItem ]
  id: OxydErisAutoinjectorBase
  components:
  - type: Sprite
    sprite: Oxyd/erisported/eris_autoinjectors.rsi
    layers:
    - state: autoinjector
      map: ["enum.SolutionContainerLayers.Base"]
    - state: autoinjector
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    size: Tiny
  - type: Solution
    solution:
      maxVol: 5
  - type: Injector
    allowedModes:
    - HyposprayInjectMode
    activeModeProtoId: HyposprayInjectMode
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: autoinjector
    solutionName: hypospray
    emptySpriteName: autoinjector0
  - type: Appearance

- type: entity
  parent: OxydErisAutoinjectorBase
  id: OxydErisAutoinjectorInaprovaline
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Inaprovaline
        Quantity: 5

