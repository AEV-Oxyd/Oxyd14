# Eris Moebius hypospray (reusable, 30u in Eris; native volume kept at 20).
- type: entity
  parent: Hypospray
  id: OxydErisHypospray
  components:
  - type: Sprite
    sprite: Oxyd/erisported/eris_autoinjectors.rsi
    layers:
    - state: hypospray
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypospray
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Oxyd/erisported/eris_autoinjectors.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: hypospray
    solutionName: hypospray
