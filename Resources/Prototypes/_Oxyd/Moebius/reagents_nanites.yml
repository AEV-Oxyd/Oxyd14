# Eris nanite reagents (code/modules/reagents/reagents/nanites.dm). Nanites are stronger but
# pricier than medicines; overdose and purge mechanics ride the shared effects.
# R2 sweep adds the inert uncapped-nanites base (Eris "uncap nanites"; a programming substrate
# made by overclocking capped nanites, so it has no own effects).

- type: reagent
  id: OxydNanoArad
  name: oxyd-reagent-arad
  desc: oxyd-reagent-arad-desc
  group: Nanites
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#88AA00"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.02
      effects:
      - !type:HealthChange
        damage:
          types:
            Blunt: -1
            Slash: -1
            Piercing: -1
      - !type:Nsa
        value: 2

