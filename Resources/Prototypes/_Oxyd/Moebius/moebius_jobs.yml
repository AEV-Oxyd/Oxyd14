# Moebius medical jobs (Eris code/game/jobs/job/medical.dm).
# Unique prototype IDs keep upstream job definitions free to evolve.
# Eris access list -> fork mapping lives in _Oxyd/Moebius/access.yml comments.

- type: job
  id: MoebiusBiolabOfficer
  name: job-name-moebius-mbo
  description: job-description-moebius-mbo
  playTimeTracker: JobMoebiusBiolabOfficer
  requirements:
  - !type:RoleTimeRequirement
    role: JobMoebiusDoctor
    time: 3h
  - !type:RoleTimeRequirement
    role: JobMoebiusChemist
    time: 1h
  - !type:RoleTimeRequirement
    role: JobMoebiusParamedic
    time: 1h
  - !type:DepartmentTimeRequirement
    department: MoebiusMedical
    time: 10h
  startingGear: MoebiusBiolabOfficerGear
  icon: JobIconMoebiusBiolabOfficer
  supervisors: job-supervisors-captain
  access:
  - ChiefMedicalOfficer
  - Command
  - Medical
  - Chemistry
  - Paramedic
  - Cryogenics
  - Maintenance
  - External
  - OxydMoebius
  - OxydMoebiusEquipment
  - OxydMoebiusMorgue
  - OxydMoebiusSurgery
  - OxydMoebiusOfficer
  special:
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: startingGear
  id: MoebiusBiolabOfficerGear
  equipment:
    jumpsuit: erisport_moebius_biolab_officers_jumpsuit
    outerClothing: erisport_moebius_biolab_officers_labcoat
    shoes: erisport_work_boots
    gloves: erisport_nitrile_gloves
    eyes: erisport_Health_Scanner_HUD
    ears: ClothingHeadsetAltMedical
    id: CMOPDA
  storage:
    back:
    - OxydErisMedkitAdvanced
    - OxydErisHypospray

- type: chameleonOutfit
  id: MoebiusBiolabOfficerChameleonOutfit
  job: MoebiusBiolabOfficer
  hasMindShield: true
  equipment:
    head: erisport_Moebius_beret
    neck: ClothingNeckStethoscope

