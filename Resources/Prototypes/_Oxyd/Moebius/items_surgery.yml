# Eris Moebius surgical tools. Eris source: code/game/objects/items/weapons/tools/*.dm.
# Tool qualities (QUALITY_CUTTING etc.) map onto OxydSurgeryTool flags; Speed mirrors
# Eris tool tier (t3 basic, t4 advanced, t5 laser).

- type: entity
  abstract: true
  parent: BaseItem
  id: OxydMoebiusSurgicalBase
  components:
  - type: Sprite
    sprite: Oxyd/erisported/eris_surgery_tools.rsi
  - type: Item
    size: Small
  - type: OxydSurgeryTool

- type: entity
  parent: OxydMoebiusSurgicalBase
  id: OxydSurgicalScalpel
  name: surgical scalpel
  description: Surgical Scalpel.
  components:
  - type: Sprite
    state: scalpel
  - type: OxydSurgeryTool
    tools: [ Scalpel ]
    quality: 80
  - type: MeleeWeapon
    damage:
      types:
        Slash: 5
    wideAnimationRotation: 60
    angle: 0
    attackRate: 1

- type: entity
  parent: OxydSurgicalScalpel
  id: OxydSurgicalScalpelAdvanced
  name: surgical scalpel advanced
  description: Surgical Scalpel Advanced.
  components:
  - type: Sprite
    state: scalpel_adv
  - type: OxydSurgeryTool
    tools: [ Scalpel ]
    quality: 90
    speed: 0.7

- type: entity
  parent: OxydSurgicalScalpel
  id: OxydSurgicalScalpelLaser
  name: surgical scalpel laser
  description: Surgical Scalpel Laser.
  components:
  - type: Sprite
    state: scalpel_laser
  - type: OxydSurgeryTool
    tools: [ Scalpel, Cautery ]
    quality: 100
    speed: 0.5

- type: entity
  parent: OxydMoebiusSurgicalBase
  id: OxydSurgicalHemostat
  name: surgical hemostat
  description: Surgical Hemostat.
  components:
  - type: Sprite
    state: hemostat
  - type: OxydSurgeryTool
    tools: [ Hemostat ]
    quality: 80

- type: entity
  parent: OxydMoebiusSurgicalBase
  id: OxydSurgicalRetractor
  name: surgical retractor
  description: Surgical Retractor.
  components:
  - type: Sprite
    state: retractor
  - type: OxydSurgeryTool
    tools: [ Retractor ]
    quality: 80

- type: entity
  parent: OxydMoebiusSurgicalBase
  id: OxydSurgicalCautery
  name: surgical cautery
  description: Surgical Cautery.
  components:
  - type: Sprite
    state: cautery
  - type: OxydSurgeryTool
    tools: [ Cautery ]
    quality: 80

- type: entity
  parent: OxydMoebiusSurgicalBase
  id: OxydSurgicalBoneSetter
  name: surgical bone setter
  description: Surgical Bone Setter.
  components:
  - type: Sprite
    state: bonesetter
  - type: OxydSurgeryTool
    tools: [ BoneSetter ]
    quality: 75

- type: entity
  parent: OxydMoebiusSurgicalBase
  id: OxydSurgicalSaw
  name: surgical saw
  description: Surgical Saw.
  components:
  - type: Sprite
    state: saw
  - type: OxydSurgeryTool
    tools: [ Saw ]
    quality: 70
  - type: Item
    size: Normal
  - type: MeleeWeapon
    damage:
      types:
        Slash: 8
    wideAnimationRotation: 60
    angle: 0
    attackRate: 1

- type: entity
  parent: OxydSurgicalSaw
  id: OxydSurgicalSawCircular
  name: surgical saw circular
  description: Surgical Saw Circular.
  components:
  - type: Sprite
    state: saw_circular
  - type: OxydSurgeryTool
    tools: [ Saw ]
    quality: 85
    speed: 0.7

- type: entity
  parent: OxydMoebiusSurgicalBase
  id: OxydSurgicalDrill
  name: surgical drill
  description: Surgical Drill.
  components:
  - type: Sprite
    state: drill
  - type: OxydSurgeryTool
    tools: [ Drill ]
    quality: 75

# Tray for organ transport (Eris surgery tray).
- type: entity
  parent: OxydMoebiusSurgicalBase
  id: OxydSurgicalTray
  name: surgical tray
  description: Surgical Tray.
  components:
  - type: Sprite
    sprite: Oxyd/erisported/eris_medkits.rsi
    state: surgeon
  - type: OxydSurgeryTool
    tools: [ Tray ]
    quality: 60
