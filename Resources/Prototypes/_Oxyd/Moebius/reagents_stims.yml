# Eris combat stims (code/modules/reagents/reagents/stims.dm). Each stim grants a timed skill
# buff to one stat and a debuff to others while it metabolises; overdose is toxin damage.
# Buff magnitudes: ADEPT ≈ 3, EXPERT ≈ 5 (Eris 25/40 mapped to the _Oxyd skill scale).
# P1 sweep adds adrenaline (Organic/Stimulator from other.dm: TGH buff + painkiller + tox).

- type: reagent
  id: OxydStimMbr
  name: oxyd-reagent-mbr
  desc: oxyd-reagent-mbr-desc
  group: Stims
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#8B4513"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.02
      effects:
      - !type:Stim
        stimId: mbr
        skill: Mec
        amount: 3
      - !type:Stim
        stimId: mbr
        skill: Bio
        amount: -3
      - !type:Nsa
        value: 3
      - !type:Addictive
        reagent: OxydStimMbr
        threshold: 10
        addictionChance: 0.2

