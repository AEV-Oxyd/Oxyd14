# Job icons reuse stock states until Eris icons are extracted.

- type: jobIcon
  parent: JobIcon
  id: JobIconMoebiusOverseer
  icon:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: ResearchDirector
  jobName: job-name-moebius-overseer

- type: jobIcon
  parent: JobIcon
  id: JobIconMoebiusScientist
  icon:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: Scientist
  jobName: job-name-moebius-scientist

- type: jobIcon
  parent: JobIcon
  id: JobIconMoebiusRoboticist
