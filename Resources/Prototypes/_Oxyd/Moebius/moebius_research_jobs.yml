  equipment:
    jumpsuit: erisport_roboticists_jumpsuit
    id: OxydMoebiusPDA
    belt: ClothingBeltUtility

- type: startingGear
  id: MoebiusRoboticistChameleonOutfit
  equipment:
    jumpsuit: erisport_roboticists_jumpsuit

- type: job
  id: MoebiusPsychiatrist
  name: job-name-moebius-psychiatrist
  description: job-description-moebius-psychiatrist
  playTimeTracker: JobMoebiusPsychiatrist
