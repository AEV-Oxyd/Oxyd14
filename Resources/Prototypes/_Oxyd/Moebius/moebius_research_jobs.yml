  startingGear: MoebiusScientistGear
  icon: JobIconMoebiusScientist
  supervisors: job-supervisors-moebius-overseer
  access:
  - Research
  - Maintenance
  - External
  - OxydMoebius
  - OxydMoebiusResearch
  - OxydMoebiusResearchEquipment

- type: startingGear
  id: MoebiusScientistGear
  equipment:
    jumpsuit: erisport_moebius_scientists_jumpsuit
    outerClothing: erisport_moebius_scientist_labcoat
    id: OxydMoebiusPDA
    belt: OxydScienceTool

- type: startingGear
  id: MoebiusScientistChameleonOutfit
  equipment:
    jumpsuit: erisport_moebius_scientists_jumpsuit

- type: job
  id: MoebiusRoboticist
  name: job-name-moebius-roboticist
