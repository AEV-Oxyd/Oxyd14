# Moebius research jobs (Eris code/game/jobs/job/science.dm).
# Overseer is head of research+medical in Eris (DEPT COMMAND); scientist,
# roboticist, psychiatrist map onto the Oxyd access levels in research_access.yml.

- type: job
  id: MoebiusExpeditionOverseer
  name: job-name-moebius-overseer
  description: job-description-moebius-overseer
  playTimeTracker: JobMoebiusExpeditionOverseer
  startingGear: MoebiusOverseerGear
  icon: JobIconMoebiusOverseer
  supervisors: job-supervisors-captain
  access:
  - ChiefMedicalOfficer
  - Command
  - Research
  - ResearchDirector
  - Medical
  - Maintenance
  - External
  - OxydMoebius
  - OxydMoebiusResearch
  - OxydMoebiusResearchEquipment
  - OxydMoebiusRobotics
  - OxydMoebiusPsychiatrist
  - OxydMoebiusOverseer
  special:
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: startingGear
  id: MoebiusOverseerGear
  equipment:
    jumpsuit: erisport_moebius_expedition_overseers_jumpsuit
    outerClothing: erisport_labcoat
    id: OxydMoebiusPDA

- type: startingGear
  id: MoebiusOverseerChameleonOutfit
  equipment:
    jumpsuit: erisport_moebius_expedition_overseers_jumpsuit

- type: job
  id: MoebiusScientist
  name: job-name-moebius-scientist
  description: job-description-moebius-scientist
