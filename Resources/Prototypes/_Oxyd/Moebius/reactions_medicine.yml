# R2 sweep. Uncapped nanites (overclocked capped nanites) and oddity tea are machine/oddity
# products, not chem-bench reactions. The positive marker's Eris gate on carrion blood can't
# be expressed; documented here as plain blood instead.

- type: reaction
  id: OxydParageneticMarkersNegative
  reactants:
    OxydMedRyetalyn: { amount: 1 }
    Carbon: { amount: 1 }
  products:
    OxydMedParageneticMarkersNegative: 1
  minTemp: 400

- type: reaction
  id: OxydParageneticMarkersPositive
  reactants:
    OxydMedParageneticMarkersNegative: { amount: 1 }
    Blood: { amount: 1 }
  products:
    OxydMedParageneticMarkersPositive: 1
  minTemp: 700
