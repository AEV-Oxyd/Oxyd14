# Eris Moebius medicine synthesis. Eris source: code/modules/reagents/recipes.dm.
# Ingredient divergences (documented in docs/moebius-medical-catalog.md):
#   hydrazine -> Diethylamine, tungsten -> Iron, blattedin -> Blood,
#   hclacid -> SulfuricAcid, pacid -> PolytrinicAcid, serotrotium -> Cryptobiolin,
#   carpotoxin -> CarpoToxin, stoxin -> ChloralHydrate, mutagen -> UnstableMutagen.

