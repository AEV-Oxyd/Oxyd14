# Eris Moebius medicines (code/modules/reagents/reagents/medicine.dm). Native chems cover
# bicaridine, kelotane, dylovene, dexalin(+,cryo), inaprovaline, tricordrazine, synaptizine,
# oculine, hyronalin, arithrazine, ipecac, chloralhydrate, haloperidol, tramadol-free opioids —
# those are reused, not duplicated. These are the Eris-unique entries.
# P1 sweep adds kognim (InflictPain) and resuscitator (Resuscitate) from other.dm/medicine.dm.
# R2 sweep adds the inert positive/negative paragenetic markers (Eris negativeling/positiveling).
# "Poison" damage type is Eris toxin; "Cellular" covers organ/genetic mending.

