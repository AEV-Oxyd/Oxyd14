# Technomancer machines — CEV-Eris engineering ports.
# Sprite work: Resources/Textures/_Oxyd/Technomancer/*.rsi converted from Eris DMIs.

# SMES — Eris smes unit. Zero server code: stock BatteryInterfaceSystem drives it;
# only the BUI + sprite + proto are new (see blueprint §2).
- type: entity
  parent: SMESBasic
  id: OxydSmesUnit
  name: smes unit
  description: Smes Unit.
  components:
  # Stock SmesVisualizer drives Charge/Input/Output layers via SmesVisualLayers
  # map keys — each layer must carry the RSI explicitly (see smes.yml).
  - type: Sprite
    sprite: _Oxyd/Technomancer/power_engi.rsi
    layers:
      - state: smes
      - map: ["enum.SmesVisualLayers.Charge"]
        state: "smes-og1" # -og0 does not exist
        shader: unshaded
        visible: false
      - map: ["enum.SmesVisualLayers.Input"]
        state: "smes-oc0"
        shader: unshaded
      - map: ["enum.SmesVisualLayers.Output"]
        state: "smes-op1"
        shader: unshaded
      - map: ["enum.WiresVisualLayers.MaintenancePanel"]
        state: smes

# Breaker box — Eris /obj/machinery/power/breakerbox circuit breaker.
- type: entity
  parent: BaseStructure
  id: OxydBreakerBox
  name: breaker box
  description: Breaker Box.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Oxyd/Technomancer/power_engi.rsi
    state: term
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 100
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
  - type: OxydBreakerBox
  - type: ApcPowerReceiver
    load: 50
  - type: UserInterface
    interfaces:
      enum.OxydBreakerUiKey.Key:
        type: OxydBreakerBui
  - type: ActivatableUI
    key: enum.OxydBreakerUiKey.Key

