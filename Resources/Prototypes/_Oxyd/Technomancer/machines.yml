# Pulsar power bridge — injects effective power into the HV net.
- type: entity
  parent: BaseStructure
  id: OxydPulsarPowerBridge
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Oxyd/Technomancer/pulsar_power_bridge.rsi
    state: bridge_on1
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 100
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
  - type: OxydPulsarBridge
  # Backing store is effectively infinite while the satellite is on beam —
  # Eris PULSAR_100_POWER * effective% flows as long as Connected.
  - type: Battery
    netsync: false
    maxCharge: 1000000000
    startingCharge: 1000000000
  - type: PowerNetworkBattery
    maxSupply: 0
  - type: NodeContainer
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: UserInterface
    interfaces:
      enum.OxydPulsarBridgeUiKey.Key:
        type: OxydBridgeBui
  - type: ActivatableUI
    key: enum.OxydPulsarBridgeUiKey.Key

