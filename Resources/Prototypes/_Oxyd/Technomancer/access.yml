# rooms (engine_equip/tech_storage/construction), and the Exultant's own
# head-of-department channel (access_ce). Everything else maps onto stock
# Engineering/Atmospherics/External/Maintenance/Command/ChiefEngineer.

- type: accessLevel
  id: OxydTechnomancer
  name: oxyd-access-technomancer

- type: accessLevel
  id: OxydTechnomancerEquipment
  name: oxyd-access-technomancer-equipment

- type: accessLevel
