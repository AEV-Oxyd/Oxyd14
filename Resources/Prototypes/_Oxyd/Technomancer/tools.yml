- type: entity
  parent: Welder
  id: OxydWelderAdv
  suffix: advanced
  components: []

# Tool mods — Eris tools/mods Adapt (single-use quality patches).
- type: entity
  parent: BaseItem
  id: OxydToolModComplicator
  suffix: +pulsing
  components:
  - type: Sprite
    sprite: Objects/Tools/multitool.rsi
    state: icon
  - type: Item
  - type: OxydToolMod
    grantsQuality: Pulsing

# RPD — Eris IJIRO rapid pipe dispenser Adapt (no stock RPD in this tree;
# minimal dispenser: use in hand -> pipe segment at your feet).
- type: entity
  parent: BaseItem
  id: OxydRapidPipeDispenser
  suffix: IJIRO
  components:
  - type: Sprite
    sprite: Objects/Tools/rcd.rsi
    state: icon
  - type: Item
  - type: OxydRpd
    pipeProto: GasPipeStraight

