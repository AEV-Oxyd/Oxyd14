# Technomancer tools & gear — Eris §10 Adapt (stock SS14 tool semantics;
# Eris' alternate tool-engine of qualities/workspeed/health stays gap-doc'd).

# Duct tape — Eris tools/tape.dm Adapt: improvised sealant mapped to stock
# Welding quality (seals doors/items) at half speed, expendable feel via sprite.
- type: entity
  parent: BaseItem
  id: OxydDuctTape
  name: duct tape
  description: Duct Tape.
  components:
  - type: Sprite
    sprite: Objects/Tools/cable-coils.rsi
    state: coilall-30
  - type: Item
  - type: Tool
    qualities: [ Welding ]
    speedModifier: 2.5
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 2

# Advanced tools — Eris advanced_tools.dm as stock tools w/ combined qualities.
- type: entity
  parent: BaseItem
  id: OxydCombiDriver
  name: combi driver
  description: Combi Driver.
  suffix: screwdriver+multitool
  components:
