# Tool mods — Eris tools/mods Adapt (single-use quality patches).
- type: entity
  parent: BaseItem
  id: OxydToolModComplicator
  name: tool mod complicator
  description: Tool Mod Complicator.
  suffix: +pulsing
  components:
  - type: Sprite
    sprite: Objects/Tools/multitool.rsi
    state: icon
  - type: Item
  - type: OxydToolMod
    grantsQuality: Pulsing

