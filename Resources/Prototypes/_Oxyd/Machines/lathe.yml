- type: entity
  id: OxydLathe
  parent: Autolathe
  name: autolathe
  description: It produces basic items using metal and glass. Has the ability to process blueprints to print new recipes.
  components:
    - type: Lathe
      idleState: icon
      runningState: building
      unlitIdleState: unlit
      unlitRunningState: unlit-building
      diskSlot:
        whitelist:
          components:
            - DigitalDataHolder
      staticPacks: []
    # Union of the armaments disk-recipe materials (ritual book, energy
    # crossbow, holy grenade). Lathes rebuild MaterialWhiteList from
    # GetMaterialWhitelistEvent at MapInit, so a plain materialWhiteList
    # would be overwritten — this merges through the event instead.
    - type: OxydStaticMaterialWhitelist
      materials: [Cloth, Plastic, Steel, Glass, Gold, Plasma]
