- type: entity
  id: OxydLathe
  parent: Autolathe
  name: autolathe
  description: It produces basic items using metal and glass. Has the ability to process blueprints to print new recipes.
  components:
    - type: Lathe
      idleState: icon
      runningState: building
      unlitIdleState: unlit
      unlitRunningState: unlit-building
      diskSlot:
        whitelist:
          components:
            - DigitalDataHolder
      staticPacks: []
    # Recipes whose material union this lathe accepts — every armaments disk
    # recipe. Lathes rebuild MaterialWhiteList from GetMaterialWhitelistEvent
    # at MapInit, so a plain materialWhiteList would be overwritten; this
    # merges through the event instead, keyed by recipe so material tweaks
    # can't drift out of sync.
    - type: OxydStaticMaterialWhitelist
      recipes: [OxydNtRitualBookRecipe, OxydNtEnergyCrossbowRecipe, OxydNtHolyGrenadeRecipe, OxydNtLightfallRecipe, OxydNtDominionRecipe]
