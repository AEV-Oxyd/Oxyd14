# ==============================================================================
# Physical Hardware Item Modules
# ==============================================================================

- type: entity
  parent: BaseItem
  id: ComputerPartCpuBasic
  name: standard CPU module (800 MHz)
  description: A microprocessor module supporting up to 4 concurrent program entities.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpuboard
  - type: ComputerCpu
    frequencyMhz: 800
    maxConcurrentPrograms: 4
    size: Small

- type: entity
  parent: BaseItem
  id: ComputerPartCpuWorkstation
  name: high-clock CPU module (3200 MHz)
  description: An enterprise microprocessor capable of executing 12 concurrent program entities.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpu_super
  - type: ComputerCpu
    frequencyMhz: 3200
    maxConcurrentPrograms: 12
    size: Small

- type: entity
  parent: BaseItem
  id: ComputerPartRamBasic
  name: RAM module (512 MB)
  description: Volatile memory required for operating system boot and concurrent program processes.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: generic
  - type: ComputerRam
    sizeMb: 512
    size: Small

- type: entity
  parent: BaseItem
  id: ComputerPartRam1024
  name: enterprise RAM module (2048 MB)
  description: High-capacity volatile memory stick for multi-tasking workstations and servers.
  components:
