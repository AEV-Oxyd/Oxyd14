    sprite: Objects/Misc/module.rsi
    state: harddisk
  - type: ComputerHardDrive
    capacityBytes: 8388608
    size: Medium
  - type: FileSystem
    maxStorageBytes: 8388608
    files:
      "/bin/os.nte": !type:ProgramVirtualFile
        name: os
        extension: nte
        directory: /bin/
        size: 4096
        isReadOnly: false
        programId: OxydOsProgram
        title: "NTOS System"
        ramUsageMb: 32
      "/bin/terminal.nte": !type:ProgramVirtualFile
