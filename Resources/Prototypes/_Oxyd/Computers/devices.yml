# ==============================================================================
# Oxyd Modular Computing & Unified Electronics Framework
# All computers are separate encapsulated entities with real hardware modules,
# DeviceLink host bridging, DataPorts, and .nte boot-first-executable drives.
# ==============================================================================

# ==============================================================================
# Host Machine: Oxyd PDA & Tablet
# ==============================================================================

- type: entity
  abstract: true
  parent: BasePDA
  id: BaseOxydPDA
  name: Oxyd PDA
  description: An advanced Personal Data Assistant running the unified NTOS filesystem architecture.
  components:
  - type: Tag
    tags:
    - Oxyd
  - type: PdaBorderColor
    borderColor: "#00D4FF"
  - type: EmbeddedComputerHost
    computerPrototype: BaseOxydPdaEmbeddedController
    borderColor: "#00D4FF"
    title: "NTOS 1.4™"
    subtitle: " | Portable Terminal"

- type: entity
  parent: BaseOxydPDA
  id: OxydTablet
  name: Oxyd tablet
  description: A rugged tactical slate tablet with enhanced memory and expandable processing modules.
  components:
  - type: PdaBorderColor
    borderColor: "#00D4FF"
  - type: EmbeddedComputerHost
    computerPrototype: BaseOxydWorkstationEmbeddedController
    borderColor: "#00D4FF"
    title: "NTOS TABLET"
    subtitle: " | Tactical Slate"

# ==============================================================================
# Host Machine: Oxyd Workstation Computer
# ==============================================================================

- type: entity
  abstract: true
  parent: BaseComputer
  id: BaseOxydComputer
  name: Oxyd workstation computer
  description: A heavy-duty modular workstation with high-throughput hardware slots and server-link capability.
  components:
  - type: Tag
    tags:
    - Oxyd
  - type: Appearance
  - type: PdaBorderColor
    borderColor: "#00D4FF"
  - type: EmbeddedComputerHost
    computerPrototype: BaseOxydWorkstationEmbeddedController
    borderColor: "#00D4FF"
    title: "NTOS WORKSTATION"
    subtitle: " | Modular Console"
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
      computer_board: !type:ContainerSlot {}
  - type: DeviceLinkSource
    ports:
    - MachineStatusSender
  - type: DeviceLinkSink
    ports:
    - MachineCommandReceiver
  - type: ActivatableUI
    key: enum.ComputerUiKey.Key
    singleUser: false
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: BaseOxydComputer
  id: OxydWorkstationComputer
  name: Oxyd workstation computer
  description: A modular desktop computer running NTOS with hardware expansion slots, network tools, and remote terminal support.

# ==============================================================================
# Encapsulated Computer Entities (Separate from Host Devices)
# ==============================================================================

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseOxydEmbeddedController
  name: embedded subsystem controller
  description: An encapsulated computer motherboard with modular CPU, RAM, HDD, NIC, and JTAG Data Port.
  components:
  - type: Tag
    tags:
    - Oxyd
  - type: Appearance
  - type: PdaBorderColor
    borderColor: "#00D4FF"
  - type: DeviceGuid
  - type: ComputerDataPort
    enabled: true
    portLabel: "JTAG-0"
  - type: OxydComputer
    template: Embedded
    defaultScreenSize: 640, 480
    allowRemoteControl: true
    allowDeviceLink: true
    requirePowerToBoot: false
    defaultHardware:
    - ComputerPartCpuBasic
    - ComputerPartRamBasic
    - ComputerPartHardDriveBasic
    - ComputerPartNetworkCardBasic
    - ComputerPartBatterySmall
  - type: ContainerContainer
    containers:
      hardware_container: !type:Container
      program_container: !type:Container
      cpu_slot: !type:ContainerSlot {}
      ram_slot: !type:ContainerSlot {}
      ram_slot_2: !type:ContainerSlot {}
      storage_slot: !type:ContainerSlot {}
      net_slot: !type:ContainerSlot {}
      battery_slot: !type:ContainerSlot {}
      sensor_slot: !type:ContainerSlot {}
      id_slot_module: !type:ContainerSlot {}
      id_slot_module_2: !type:ContainerSlot {}
      disk_slot_module: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      cpu_slot:
        name: CPU
        whitelist:
          components: [ ComputerCpu ]
      ram_slot:
        name: RAM Slot 1
        whitelist:
          components: [ ComputerRam ]
      ram_slot_2:
        name: RAM Slot 2
        whitelist:
          components: [ ComputerRam ]
      storage_slot:
        name: Hard Drive
        whitelist:
          components: [ ComputerHardDrive ]
      net_slot:
        name: Network Card
        whitelist:
          components: [ ComputerNetworkCard ]
      battery_slot:
        name: Backup Battery
        whitelist:
          components: [ ComputerBatteryModule ]
      sensor_slot:
        name: Sensor Module
        whitelist:
          components: [ ComputerSensorModule ]
      id_slot_module:
        name: ID Module 1
        whitelist:
          components: [ ComputerIdCardSlotModule ]
      id_slot_module_2:
        name: ID Module 2
        whitelist:
          components: [ ComputerIdCardSlotModule ]
      disk_slot_module:
        name: Disk Module
        whitelist:
          components: [ ComputerDiskSlotModule ]
  - type: ModularComputer
    maxHardDriveSlots: 1
    maxRamSlots: 2
    maxIdModuleSlots: 2
    maxBatterySize: Small
  - type: ComputerStats
  - type: NetworkBandwidth
  - type: DeviceLinkSource
    ports:
    - PowerTrigger
    - InternetLink
    - TerminalLink
    - OutputTrigger1
    - OutputTrigger2
    - ComputerCommandSender
  - type: DeviceLinkSink
    invokeLimit: 0
    ports:
    - PowerTrigger
    - InternetLink
    - TerminalLink
    - InputTrigger1
    - InputTrigger2
    - ComputerStatusReceiver
  - type: UserInterface
    interfaces:
      enum.ComputerUiKey.Key:
        type: ComputerBoundUserInterface
      enum.PdaUiKey.Key:
        type: ComputerBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: WiresPanel
  - type: Wires
    layoutId: OxydComputerMotherboard

