- type: entity
  parent: BasePDACartridge
  id: OxydOsCartridge
  name: NTOS system cartridge
  description: Core operating system kernel handling system settings, hardware diagnostics, local device port links, and launching applications.
  components:
  - type: Sprite
    state: cart-nav
  - type: UIFragment
    ui: !type:OsUi
  - type: Cartridge
    programName: NTOS System
    icon:
      sprite: Interface/Misc/program_icons.rsi
      state: crew_manifest
  - type: OsCartridge
  - type: Tag
    tags:
    - Oxyd
    - Cartridge

- type: entity
  parent: BasePDACartridge
  id: OxydEmbeddedOsCartridge
  name: embedded system controller cartridge
  description: Core embedded controller operating system for monitoring machinery, APCs, life support, and industrial device links.
  components:
  - type: Sprite
    state: cart-b
  - type: UIFragment
    ui: !type:EmbeddedOsUi
  - type: Cartridge
    programName: Embedded Controller OS
    icon:
      sprite: Structures/Machines/server.rsi
      state: server-on
  - type: EmbeddedOsCartridge
  - type: Tag
    tags:
    - Oxyd
    - Cartridge

- type: entity
  parent: BasePDACartridge
  id: OxydFileBrowserCartridge
  name: file browser cartridge
