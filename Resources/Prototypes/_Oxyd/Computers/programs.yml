# ==============================================================================
# NTOS Program Entities (.nte Runtime Process Entities)
# Each running program is a real EntityUid inside program_container with its own
# UserInterfaceComponent delivering direct BoundUserInterface states.
# ==============================================================================

- type: entity
  abstract: true
  id: BaseOxydProgram
  name: computer program
  components:
  - type: Program
  - type: Tag
    tags:
    - Oxyd
    - Program

- type: entity
  parent: BaseOxydProgram
  id: OxydOsProgram
  name: NTOS system
  description: Core operating system kernel handling system settings, hardware diagnostics, DeviceLink ports, and launching child programs.
  components:
  - type: Program
    title: "NTOS System"
    ramUsageMb: 32
    cpuUsagePercent: 5.0
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: ai_core
  - type: OsProgram
  - type: UserInterface
    interfaces:
      enum.ProgramUiKey.Key:
        type: OsProgramBui

- type: entity
  parent: BaseOxydProgram
  id: OxydEmbeddedOsProgram
  name: embedded system controller
  description: Core embedded controller operating system for machinery, APCs, life support, and industrial DeviceLink supervision.
  components:
  - type: Program
    title: "Embedded Controller OS"
    ramUsageMb: 16
    cpuUsagePercent: 3.0
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: ai_core
  - type: EmbeddedOsProgram
  - type: UserInterface
    interfaces:
      enum.ProgramUiKey.Key:
        type: EmbeddedOsProgramBui

- type: entity
  parent: BaseOxydProgram
