- type: entity
  name: Oxyd Gun
  parent: BaseItem
  id: WeaponOxyd
  description: A rooty tooty point and shooty.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
  - type: OxydGun
    firemodes:
    - baseBurstFiremode
    - chargeHitscanFiremode
    - baseFiremode
    - chargeFiremode
    - baseBurstLaserFiremode
  - type: OxydHandheldGun
  - type: OxydMagazineChamber
    bulletSlot:
    - name: Chamber
      insertSound: null
      ejectSound: null
      priority: 0
      whitelist:
        components:
          - OxydBullet
    magazineSlot:
    - name: Magazine
      insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
      ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
      priority: 2
      whitelist:
        components:
          - OxydMagazine
  - type: OxydGunLaserProvider
    laserProto:
    - !type:LaserAmmoDef
      cost: 50
      laser: OxydHitscan
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        priority: 1
        whitelist:
          components:
            - OxydCharge
  - type: StaticPrice
    price: 500
  - type: OxydGunChargeup
    maxCharge: 1.0
  - type: GlowOnCharge
  - type: RecoilHandler
  - type: OxydAttachmentHolder
    slots:
      - Barrel
      - Scope
    whitelist:
      components:
        - OxydAttachment

