  provider: OxydMagazineChamber
  providerId: 0
  addedInaccuracyMaximum: 0
  effects:
  - !type:GunEffectWait
    waitPeriod: 0.3125
    fowardMax: 3
  - !type:GunEffectCheckConscious
  - !type:GunEffectCheckAmmo
  - !type:GunEffectCheckHandheld
  - !type:GunEffectModifyCharge
    addAmount: 0.2
  - !type:GunEffectRepeatNextTickIfMouseHeld
    stepBack: 5
    validDiff: 0.2
    hardWait: true
    maxMissed: 15
  - !type:GunEffectTryFireMouseDirection
  - !type:GunEffectResetCharge

- type: gunFiremode
