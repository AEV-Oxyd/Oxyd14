  - !type:GunEffectCheckAmmo
  - !type:GunEffectCheckHandheld
  - !type:GunEffectWait
    waitPeriod: 0.1
    stepBack: 3
  - !type:GunEffectTryFireMouseDirection
  - !type:GunEffectRepeatNextTick
    repeatCount: 2
    stepBack: 5
    triggerTimeout: 0.3
  - !type:GunEffectRepeatNextTickIfMouseHeld
    stepBack: 6
    validDiff: 0.1
    hardWait: true
    maxMissed: 15

- type: gunFiremode
