- type: entity
  parent: BasicHitscan
  id: OxydHitscan
  name: oxyd debug laser ray
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_laser
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_laser
  - type: HitscanBasicEffects
  - type: OxydHitscanProjectile
  - type: Physics
    bodyType: Static
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      oxyd:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        friction: 0
  - type: OxydProjectileApplyDamage
    damage:
        types:
          Blunt: 25
  - type: TimedDespawn
    lifetime: 10


- type: entity
  name: Oxyd Bullet
