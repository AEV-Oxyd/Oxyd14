- type: soundCollection
  id: oxydFire
  files:
  - /Audio/Weapons/Guns/Gunshots/c-20r.ogg

- type: gunFiremode
  id: baseFiremodeRevolver
  icon:
    sprite: /Textures/Oxyd/erisported/gunactions16.rsi
    state: semi
  fireSound:
    path: /Audio/Weapons/Guns/Gunshots/c-20r.ogg
  providerId: defaultRevolver
  addedInaccuracyMaximum: 0
  effects:
  - !type:GunEffectCheckConscious
  - !type:GunEffectCheckAmmo
  - !type:GunEffectCheckHandheld
  - !type:GunEffectTryFireMouseDirection
  - !type:GunEffectWait
    waitPeriod: 0.1

- type: entity
  name: Oxyd Revolver
  parent: BaseItem
  id: WeaponOxydRevolver
  description: A rooty tooty point and shooty.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/SMGs/c20r.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Large
  - type: OxydGun
    firemodes:
    - baseFiremodeRevolver
  - type: OxydHandheldGun
  - type: OxydRevolvingChamber
    providers:
      defaultRevolver: 
        basecapacity: 6
        whitelist:
          components:
          - OxydBullet
  - type: StaticPrice
    price: 500
  - type: RecoilHandler
  - type: OxydAttachmentHolder
    slots:
    - Barrel
    - Scope
    - Internal
    whitelist:
      components:
      - OxydAttachment
  - type: OxydAttachmentSpawner
    insert:
    - AttachmentOxydCapacitiy

- type: entity
  parent: BasicHitscan
  id: OxydHitscan
  name: oxyd debug laser ray
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_laser
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_laser
  - type: HitscanBasicEffects
  - type: OxydHitscanProjectile
  - type: Physics
    bodyType: Static
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      oxyd:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        friction: 0
  - type: OxydProjectileApplyDamage
    damage:
        types:
          Blunt: 25
  - type: TimedDespawn
    lifetime: 10


- type: entity
  name: Oxyd Bullet
  parent: BaseItem
  id: BulletOxyd
  description: A rooty tooty point and shooty.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: slug
  - type: Item
    size: Large
  - type: OxydBullet
    speed: 20
    projectileEntity: ProjectileOxyd
  - type: Bundable
    group: BundleGroup
    volume: 5

- type: entity
  name: Oxyd Magazine
  parent: BaseItem
  id: MagazineOxyd
  description: A rooty tooty point and shooty.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_mag.rsi
    state: base
  - type: Item
    size: Large
  - type: OxydMagazine
    capacity: 30
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: BulletOxyd
        amount: 30

- type: entity
  name: Oxyd Barrel Attachemnt
  parent: BaseItem
  id: AttachmentOxydBarrel
  description: A rooty tooty point and shooty.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_mag.rsi
    state: base
  - type: Item
    size: Large
  - type: OxydAttachment
    slot: Barrel
    mods:
     - !type:DamageMod
        addMod:
          types:
            Blunt: 50

- type: entity
  name: Oxyd Scope Attachment
  parent: BaseItem
  id: AttachmentOxydScope
  description: A rooty tooty point and shooty.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_mag.rsi
    state: base
  - type: Item
    size: Large
  - type: OxydAttachment
    slot: Scope
    mods:
     - !type:DamageMod
        addMod:
          types:
          Heat: 250
     - !type:DamageMod
        addMod:
          types:
          Heat: 250

- type: entity
  name: Oxyd Capacity Attachment
  parent: BaseItem
  id: AttachmentOxydCapacitiy
  description: A rooty tooty point and shooty.
  components:
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/pistol_mag.rsi
    state: base
  - type: Item
    size: Large
  - type: OxydAttachment
    slot: Internal
    mods:
    - !type:WeaponCapacityMod
      capacityAdd: 8

- type: entity
  id: ProjectileOxyd
  name: bullet (15.2×169 mm shrapnel)
  categories: [ HideSpawnMenu ]
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    state: buckshot-flare
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      oxyd:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
        friction: 0
  - type: TimedDespawn
    lifetime: 10
  - type: OxydProjectileApplyDamage
    damage:
        types:
          Blunt: 25
  - type: OxydBulletOnFireRecoil
    recoil: 10

