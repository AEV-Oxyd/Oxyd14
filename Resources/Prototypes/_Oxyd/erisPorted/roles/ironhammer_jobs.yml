# Ironhammer job variants.
# These intentionally use unique prototype IDs so upstream job definitions can
# continue to evolve without this port modifying the same YAML prototypes.

- type: job
  id: IronhammerHeadOfSecurity
  name: job-name-ironhammer-hos
  description: job-description-ironhammer-hos
  playTimeTracker: JobIronhammerHeadOfSecurity
  requirements:
  - !type:RoleTimeRequirement
    role: JobIronhammerWarden
    time: 3h
  - !type:RoleTimeRequirement
    role: JobIronhammerDetective
    time: 1h
  - !type:RoleTimeRequirement
    role: JobIronhammerSecurityOfficer
    time: 5h
  - !type:DepartmentTimeRequirement
    department: IronhammerSecurity
    time: 10h
  startingGear: IronhammerHeadOfSecurityGear
  icon: JobIconIronhammerCommander
  supervisors: job-supervisors-captain
  access:
  - HeadOfSecurity
  - Command
  - Brig
  - Security
  - Armory
  - Maintenance
  - External
  - Detective
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: CommandStaff

- type: startingGear
  id: IronhammerHeadOfSecurityGear
  equipment:
    eyes: erisport_Ironhammer_tactical_HUD
    id: HoSPDA
    gloves: ClothingHandsGlovesCombat
    ears: ClothingHeadsetAltSecurity
    pocket1: WeaponPistolLamia
  storage:
    back:
    - Flash
    - WeaponPDWMartin
    - MagazineMagnum

- type: chameleonOutfit
  id: IronhammerHeadOfSecurityChameleonOutfit
  job: IronhammerHeadOfSecurity
  hasMindShield: true
  equipment:
    head: erisport_Commander_beret
    mask: erisport_Ironhammer_gasmask
    neck: ClothingNeckCloakHos

