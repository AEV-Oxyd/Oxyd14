# Ironhammer-specific loadout prototypes. These are separate from the
# upstream Security loadout files so upstream changes remain conflict-free.

# Head of Security
- type: loadoutEffectGroup
  id: IronhammerMasterHeadOfSecurity
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobIronhammerHeadOfSecurity
      time: 20h

- type: loadout
  id: IronhammerHeadOfSecurityJumpsuit
  equipment:
    jumpsuit: erisport_Ironhammer_Commanders_jumpsuit
  groupBy: "jumpsuit"

- type: loadout
  id: IronhammerHeadOfSecurityJumpskirt
  equipment:
    jumpsuit: erisport_Ironhammer_Commanders_jumpskirt
  groupBy: "jumpskirt"

- type: loadout
  id: IronhammerHeadOfSecurityTurtleneck
