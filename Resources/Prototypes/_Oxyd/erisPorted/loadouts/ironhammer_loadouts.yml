    jumpsuit: erisport_ironhammer_formal_uniform
  groupBy: "jumpsuit"

- type: loadout
  id: IronhammerHeadOfSecurityTurtleneckSkirt
  equipment:
    jumpsuit: erisport_Ironhammer_Commanders_jumpskirt
  groupBy: "jumpskirt"

- type: loadout
  id: IronhammerHeadOfSecurityFormalSuit
  equipment:
    jumpsuit: erisport_ironhammer_formal_uniform
  groupBy: "jumpsuit"

- type: loadout
  id: IronhammerHeadOfSecurityFormalSkirt
  equipment:
    jumpsuit: ClothingUniformJumpskirtHosFormal
  groupBy: "jumpskirt"

- type: loadout
  id: IronhammerHeadOfSecurityHead
  equipment:
    head: erisport_Ironhammer_Commander_Hat

- type: loadout
  id: IronhammerHeadOfSecurityBeret
  equipment:
    head: erisport_Commander_beret

- type: loadout
  id: IronhammerHeadOfSecurityCloak
  equipment:
    neck: ClothingNeckCloakHos

- type: loadout
  id: IronhammerHeadOfSecurityMantle
  equipment:
    neck: ClothingNeckMantleHOS
