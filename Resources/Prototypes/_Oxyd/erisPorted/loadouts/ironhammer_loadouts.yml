    proto: IronhammerMasterHeadOfSecurity

- type: startingGear
  id: IronhammerHeadOfSecurityMantle
  equipment:
    neck: ClothingNeckMantleHOS

- type: loadout
  id: IronhammerHeadOfSecurityCoat
  equipment:
    outerClothing: erisport_greatcoat_ironhammer

- type: loadout
  id: IronhammerHeadOfSecurityWinterCoat
  equipment:
    outerClothing: ClothingOuterWinterHoS

