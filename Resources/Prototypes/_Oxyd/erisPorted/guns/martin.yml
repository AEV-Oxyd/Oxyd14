- type: entity
  name: FS PDW E Martin
  parent: [BaseWeaponBatterySmall]
  id: WeaponPDWMartin
  description: The FS PDW E "Martin" is essentially a downscaled Spider Rose, made for Ironhammer Marshals and civilians to use as a personal self-defence weapon. Its self-charging energy cell glows cyan on stun fire and red on lethal.
  components:
  - type: Sprite
    sprite: Oxyd/erisported/pdw.rsi
    layers:
    - state: PDW
      map: ["enum.GunVisualLayers.Base"]
  - type: Appearance
  - type: Gun
    fireRate: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 62.5
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: BulletDisabler
      fireCost: 62.5
      pacifismAllowedMode: true
    - proto: RedLaser
      fireCost: 62.5
  - type: GenericVisualizer
    visuals:
      enum.BatteryWeaponFireModeVisuals.State:
        enum.GunVisualLayers.Base:
          BulletDisabler: { state: stun }
          RedLaser: { state: lethal }
  - type: BatterySelfRecharger
    autoRechargeRate: 40
  - type: StaticPrice
    price: 700
