            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service (8-11)
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 1, 1 ]
            Janitor: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 1, 2 ]
            Reporter: [ 1, 2 ]
            #engineering (6-8)
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 2, 2 ]
            #medical (8-8)
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 3 ]
            Paramedic: [ 1, 1 ]
            MedicalIntern: [ 2, 2 ]
            #science (6-6)
            Scientist: [ 4, 4 ]
            ResearchAssistant: [ 2, 2 ]
            #security (9-10)
            IronhammerWarden: [ 1, 1 ]
            IronhammerMedicalSpecialist: [ 1, 1 ]
            IronhammerSecurityOfficer: [ 5, 5 ]
            IronhammerDetective: [ 1, 1 ]
            IronhammerSecurityCadet: [ 2, 2 ]
            Lawyer: [ 1, 1 ]
            #supply (6)
            SalvageSpecialist: [ 3, 3 ]
