# Eris construction.dm blueprint catalog (P4.13). Each entry maps /datum/nt_blueprint:
# the entity Manifestation raises and the materials Uproot returns.
#
# Named divergences (Eris -> Oxyd14):
# - The Eris last-shelter device does not exist in this fork, so the Eye of the Protector
#   recipe keeps its gold/plasteel/biomatter/cruciform cost only.
# - Eris builds the biogenerator and the bioreactor from several parts; the fork has one
#   entity each, so the part costs are summed into one recipe.
# - Eris builds the biomass tank from a large biomatter canister; biomatter is a material
#   stack in this fork, so the tank recipe uses steel and plastic only.

- type: oxydNtBlueprint
  id: OxydNtBlueprintAltar
  name: oxyd-nt-blueprint-altar-name
  build: OxydNtAltar
  buildTime: 10
  materials:
  - stack: Steel
    amount: 10
  - stack: Biomatter
    amount: 50
  - stack: Silver
    amount: 5
  - item: OxydNtCruciform

