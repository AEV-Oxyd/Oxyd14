# NeoTheology machines (P2). No NT RSI exists in this fork, so sprites are borrowed from real machines.
- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtCruciformForge
  name: cruciform forge
  description: Prints cruciforms from biomatter, plasteel and gold.
  components:
  - type: CruciformForge
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: Appearance
  - type: Sprite
    sprite: Structures/Machines/seed_extractor.rsi
    state: seedextractor
  # P2.10a: MaterialStorage is the forge's single store. storageLimit is a *total* cap (there is no
  # per-material field); 10050 = 50 sheets of each recipe material in volume units (biomatter 1/sheet,
  # plasteel/gold 100/sheet).
  - type: MaterialStorage
    storageLimit: 10050

- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtBiogenerator
  name: biogenerator
  description: Burns biomatter to feed the power network.
  components:
  - type: Biogenerator
  - type: NodeContainer
    nodes:
      output_mv:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: PowerSupplier
    supplyRampRate: 5000
    supplyRampTolerance: 1500
  - type: MaterialStorage
  - type: Appearance
  - type: Sprite
    sprite: Structures/Machines/biofabricator.rsi
    state: icon

- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtBioreactor
  name: bioreactor
  description: Processes crops left in its sealed chamber into biomatter.
  components:
  - type: Bioreactor
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: Appearance
  - type: Sprite
    sprite: Structures/Machines/gasrecycler.rsi
    state: icon
