# Native NT machines. Eye, reader, forge and obelisk now use static Eris source sprites.
- type: entity
  parent: BiomassReclaimer
  id: OxydNtBiomatterReclaimer
  name: biomatter reclaimer
  description: Reclaims organic matter for NeoTheology machines.
  components:
  - type: BiomassReclaimer
    outputMaterial: Biomatter

- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtCruciformForge
  name: cruciform forge
  description: Prints cruciforms from biomatter, plasteel and gold.
  components:
  - type: CruciformForge
  - type: LitanyMachine
  # Headless lathe: the litany queues the cruciform recipe and LatheSystem runs the print.
  # No ActivatableUI/LatheUiKey — the forge has no player-facing menu.
  - type: Lathe
    staticPacks: [ OxydNtForgePack ]
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: Appearance
  - type: Sprite
    sprite: Oxyd/NeoTheology/machinery.rsi
    state: cruciforge
  # P2.10a: MaterialStorage is the forge's single store. storageLimit is a *total* cap (there is no
  # per-material field); 10050 = 50 sheets of each recipe material in volume units (biomatter 1/sheet,
  # plasteel/gold 100/sheet).
  - type: MaterialStorage
    storageLimit: 10050
    # Static whitelist — exactly the materials the forge recipes consume.
    materialWhiteList: [Biomatter, Plasteel, Gold]

- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtBiogenerator
  name: biogenerator
  description: Burns biomatter to feed the power network.
  components:
  # Fuel burning rides the stock generator path: FuelGenerator + SolidFuelGeneratorAdapter,
  # with MaterialStorage as the fuel hopper. Biogenerator only marks the machine for the
  # litanies and derates output via Dirtiness.
  - type: Biogenerator
  - type: LitanyMachine
  - type: FuelGenerator
    targetPower: 500000
    maxTargetPower: 500000
    minTargetPower: 0
    optimalPower: 500000
    # One biomatter unit per second at full output.
    optimalBurnRate: 1
  - type: SolidFuelGeneratorAdapter
    fuelMaterial: Biomatter
    multiplier: 1
  - type: NodeContainer
    nodes:
      output_mv:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: PowerSupplier
    supplyRampRate: 5000
    supplyRampTolerance: 1500
  - type: MaterialStorage
    materialWhiteList: [Biomatter]
  - type: Appearance
  - type: Sprite
    sprite: Structures/Machines/biofabricator.rsi
    state: icon
  - type: ActivatableUI
    key: enum.BiogeneratorConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.BiogeneratorConsoleUiKey.Key:
        type: BiogeneratorConsoleBoundUserInterface

- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtBioreactor
  name: bioreactor
  description: Processes crops and dead organic bodies on its chamber tile into biomatter, preserving equipment and implants.
  components:
  - type: Bioreactor
  - type: LitanyMachine
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: Appearance
  - type: Sprite
    sprite: Structures/Machines/gasrecycler.rsi
    state: icon
  - type: ActivatableUI
    key: enum.BioreactorConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.BioreactorConsoleUiKey.Key:
        type: BioreactorConsoleBoundUserInterface

# P2.12: reader + cloner + biomass tank. Plan says the tank is a Solution; biomatter is a
# MaterialPrototype in this port (P2.3), not a reagent, and P2.10a's rule is one store — so the tank
# and the cloner both use MaterialStorage, the same store the forge and biogenerator use.
- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtCruciformReader
  name: cruciform reader
  description: Reads the soul a cruciform carries.
  components:
  - type: CruciformReader
  - type: LitanyMachine
  - type: ItemSlots
    slots:
      cruciform:
        name: cruciform
        whitelist:
          components:
          - Cruciform
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: Appearance
  - type: Sprite
    sprite: Oxyd/NeoTheology/machinery.rsi
    state: reader_off

# Upstream cloning pod (body growth is its job) with the module's own biomass and the reader link.
- type: entity
  parent: [ CloningPod ]
  id: OxydNtCloner
  name: cruciform cloner
  description: Grows a body for a soul read off a cruciform.
  components:
  - type: CruciformCloner
  - type: LitanyMachine
  - type: CloningPod
    requiredMaterial: Biomatter
  - type: MaterialStorage
    materialWhiteList:
    - Biomatter
    storageLimit: 300

- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtBiomassContainer
  name: biomass container
  description: Holds biomatter for the cloner.
  components:
  - type: MaterialStorage
    materialWhiteList:
    - Biomatter
    storageLimit: 1000
  - type: Appearance
  - type: Sprite
    sprite: Structures/Storage/tanks.rsi
    state: generictank-1

# P2.14: the obelisk's aura (P2.13). Observation payout is a no-op until Phase 3's Eye lands.
- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtObelisk
  name: NeoTheology obelisk
  description: Projects the faith of the faithful, purging the unclean around it.
  components:
  - type: Obelisk
  - type: ApcPowerReceiver
    powerLoad: 30
  # Soft golden idle aura while powered (LitOnPowered ties it to APC power).
  - type: PointLight
    radius: 3.5
    energy: 0.9
    color: "#d9b26a"
  - type: LitOnPowered
  - type: Appearance
  - type: Sprite
    sprite: Oxyd/NeoTheology/machinery.rsi
    state: nt_obelisk

# P2.16: the armory. Points are local until P3.5 rebases them onto the Eye.
- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtArmamentsPrinter
  name: NeoTheology armaments printer
  description: Spends the faith's armament points to print gear for the faithful.
  components:
  - type: ArmamentsPrinter
  - type: LitanyMachine
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: Appearance
  - type: Sprite
    sprite: Structures/Machines/uniform_printer.rsi
    state: icon
  - type: ActivatableUI
    key: enum.ArmamentsPrinterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ArmamentsPrinterUiKey.Key:
        type: ArmamentsPrinterBoundUserInterface

# P3.7: the Eye of the Protector (Eris obj/machinery/power/eotp). Its status UI is read-only:
# the server pushes a snapshot on open; no client messages, no buttons.
- type: entity
  parent: [ BaseMachinePowered ]
  id: OxydNtEyeOfTheProtector
  name: Eye of the Protector
  description: Watches over the faithful, banking observation and armament points for their miracles.
  components:
  - type: EyeOfTheProtector
  - type: LitanyMachine
  - type: ApcPowerReceiver
    # Eris idle is 30W; active draw is 2500W during a miracle, which is not modelled here.
    powerLoad: 30
  - type: Appearance
  - type: Sprite
    sprite: Oxyd/NeoTheology/eye.rsi
    state: Eye_of_the_Protector
  - type: ActivatableUI
    key: enum.EyeOfTheProtectorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.EyeOfTheProtectorUiKey.Key:
        type: EyeOfTheProtectorBoundUserInterface
