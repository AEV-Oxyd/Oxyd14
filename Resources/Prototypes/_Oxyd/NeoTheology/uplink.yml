# Eris datum/core_module/cruciform/uplink (modules.dm:30-53): the hidden inquisitor uplink.
# The store mirrors the traitor uplink preset and adds the NeoTheology category
# (uplink/neotheology.dm:39). Only the Eris listings that exist in this fork are ported; the
# NT-pattern energy weapons and the preacher ascension kit have no fork equivalents yet.

- type: storeCategory
  id: OxydNtUplink
  name: store-category-nt-uplink
  priority: 12

- type: entity
  parent: StorePresetUplink
  id: OxydNtUplink
  categories: [ HideSpawnMenu ]
  components:
  - type: Store
    name: store-preset-name-nt-uplink
    categories:
    - UplinkWeaponry
    - UplinkAmmo
    - UplinkExplosives
    - UplinkChemicals
    - UplinkDeception
    - UplinkDisruption
    - UplinkImplants
    - UplinkAllies
    - UplinkWearables
    - UplinkJob
    - UplinkPointless
    - UplinkObjective
    - OxydNtUplink
    currencyWhitelist:
    - Telecrystal
    balance:
      Telecrystal: 15
    expectedFaction:
    - NanoTrasen

