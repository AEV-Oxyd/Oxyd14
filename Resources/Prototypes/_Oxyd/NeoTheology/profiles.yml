# Eris access story:
#   Disciple/Acolyte/Agrolyte/Custodian: OxydNtFollower + OxydNtCommon (from modules)
#   Preacher/Inquisitor:                 OxydNtFollower + OxydNtCommon + OxydNtClergy
# litanySets mirror the union of the RankModules table in CruciformSystem so a profile
# swap and a module swap unlock exactly the same sets.

- type: oxydNeoTheologyProfile
  id: OxydNtDisciple
  name: oxyd-neotheology-profile-disciple
  accessPrivileges:
  - OxydNtFollower
  - OxydNtCommon
  cruciformCapacity: 50
  regenerationMultiplier: 1
  litanySets:
  - OxydLitanyCommon
  - OxydLitanyMachinery
  - OxydLitanyGroup
  canChannel: false
  countsAsChannelingFollower: true

- type: oxydNeoTheologyProfile
