# Eris MATERIAL_BIOMATTER, ported as a normal SS14 material stack.
# Produced by the biomass reclaimer (P2.4) and the bioreactor (P2.9);
# consumed by holy-door repair (P2.5) and the cruciform forge (P2.6).

- type: stack
  parent: BaseVeryLargeStack
  id: Biomatter
  name: stack-biomatter
  icon: { sprite: /Textures/_Oxyd/NeoTheology/biomatter.rsi, state: biomatter }
  spawn: OxydNtBiomatterStack1
  # Offerings consume up to 200 (offerings.yml); the cap must fit a single stack.
  maxCount: 250

- type: material
  id: Biomatter
  name: biomatter
  unit: materials-unit-sheet
  stackEntity: OxydNtBiomatterStack1
  icon: { sprite: _Oxyd/NeoTheology/biomatter.rsi, state: biomatter }
  color: '#7a4f2a'
  price: 0.05

- type: entity
  parent: MaterialBase
  id: OxydNtBiomatter
  name: biomatter
  description: A soft, strange sheet of processed biomatter.
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Biomatter: 1
  - type: Sprite
    sprite: _Oxyd/NeoTheology/biomatter.rsi
    state: biomatter_3
    layers:
    - state: biomatter_3
      map: ["base"]
  - type: Stack
    stackType: Biomatter
    count: 10
    baseLayer: base
    layerStates:
    - biomatter
    - biomatter_2
    - biomatter_3

- type: entity
  parent: OxydNtBiomatter
  id: OxydNtBiomatterStack10
  suffix: 10
  components:
  - type: Stack
    count: 10

- type: entity
  parent: OxydNtBiomatter
  id: OxydNtBiomatterStack1
  suffix: Single
  components:
  - type: Stack
    count: 1
