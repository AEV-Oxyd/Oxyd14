# Eris MATERIAL_BIOMATTER, ported as a normal SS14 material stack.
# Produced by the biomass reclaimer (P2.4) and the bioreactor (P2.9);
# consumed by holy-door repair (P2.5) and the cruciform forge (P2.6).

- type: stack
  parent: BaseVeryLargeStack
  id: Biomatter
  name: stack-biomatter
  icon: { sprite: /Textures/Objects/Materials/materials.rsi, state: monkeyhide }
  spawn: OxydNtBiomatterStack1

- type: material
  id: Biomatter
  name: biomatter
  unit: materials-unit-sheet
  stackEntity: OxydNtBiomatterStack1
