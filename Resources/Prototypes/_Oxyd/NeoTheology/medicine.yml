# Eris holy medicines. Native metabolism owns processing, dose scaling, and removal.
# Native Poison damage represents Eris toxin accumulation. Native status effects represent overdose symptoms.
- type: reagent
  id: OxydNtAngelsBalm
  name: oxyd-reagent-angels-balm
  desc: oxyd-reagent-angels-balm-desc
  group: Medicine
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#C8A5DC"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.02
      effects:
      - !type:Analgesic
        source: OxydNtAngelsBalm
        strength: 25
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: OxydNtAngelsBalm
          min: 90.01
        damage:
          types:
            Poison: 0.4
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        time: 2
        conditions:
        - !type:ReagentCondition
          reagent: OxydNtAngelsBalm
          min: 90.01

- type: reagent
  id: OxydNtDeusBlessing
  name: oxyd-reagent-deus-blessing
  desc: oxyd-reagent-deus-blessing-desc
  group: Medicine
  physicalDesc: reagent-physical-desc-opaque
  flavor: medicine
  color: "#CB68FC"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.02
      effects:
      - !type:Analgesic
        source: OxydNtDeusBlessing
        strength: 50
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: OxydNtDeusBlessing
          min: 90.01
        damage:
          types:
            Poison: 0.4
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        time: 30
        conditions:
        - !type:ReagentCondition
          reagent: OxydNtDeusBlessing
          min: 90.01
      - !type:GenericStatusEffect
        key: SlurredSpeech
        component: SlurredAccent
        time: 30
        conditions:
        - !type:ReagentCondition
          reagent: OxydNtDeusBlessing
          min: 90.01
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.8
        sprintSpeedModifier: 0.8
        time: 2
        conditions:
        - !type:ReagentCondition
          reagent: OxydNtDeusBlessing
          min: 90.01
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 3
        probability: 0.01
        conditions:
        - !type:ReagentCondition
          reagent: OxydNtDeusBlessing
          min: 90.01

