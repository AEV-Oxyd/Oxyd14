# Native organs and relations support these replacements without a second body model.
# Human sprites are placeholders until dedicated prosthetic art exists.
- type: entity
  id: OxydOrganRobotic
  parent: OrganBase
  abstract: true
  description: An artificial replacement for a human limb.
  components:
  - type: RoboticOrgan
  - type: VisualOrganMarkings
    markingData:
      group: Human
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    color: "#A0A0A0"
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
      color: "#A0A0A0"

- type: entity
  id: OxydOrganRoboticArmLeft
  parent: [OrganBaseArmLeft, OxydOrganRobotic]
  name: robotic left arm
  description: Robotic left arm.

- type: entity
  id: OxydOrganRoboticArmRight
  parent: [OrganBaseArmRight, OxydOrganRobotic]
  name: robotic right arm
  description: Robotic right arm.

- type: entity
  id: OxydOrganRoboticHandLeft
  parent: [OrganBaseHandLeft, OxydOrganRobotic]
  name: robotic left hand
  description: Robotic left hand.

- type: entity
  id: OxydOrganRoboticHandRight
  parent: [OrganBaseHandRight, OxydOrganRobotic]
  name: robotic right hand
  description: Robotic right hand.

- type: entity
  id: OxydOrganRoboticLegLeft
  parent: [OrganBaseLegLeft, OxydOrganRobotic]
  name: robotic left leg
  description: Robotic left leg.

- type: entity
  id: OxydOrganRoboticLegRight
  parent: [OrganBaseLegRight, OxydOrganRobotic]
  name: robotic right leg
  description: Robotic right leg.

- type: entity
