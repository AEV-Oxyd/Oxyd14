- type: entity
  parent: [BaseSubdermalImplant, BaseItem]
  id: OxydNtCruciform
  name: cruciform
  description: A dormant NeoTheology implant.
  components:
  - type: Sprite
    sprite: Oxyd/erisported/cruciform.rsi
    state: cruciform_green
  - type: Item
    size: Small
    sprite: Oxyd/erisported/cruciform.rsi
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState
  - type: Cruciform
  - type: UserInterface
    interfaces:
      enum.LitanyUiKey.Book:
        type: LitanyBoundUserInterface
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu

- type: entity
  parent: BaseItem
  id: OxydNtBible
  name: NeoTheology litany book
  description: A reference book for spoken NeoTheology litanies.
  components:
  - type: LitanyBook
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: ActivatableUI
    key: enum.LitanyUiKey.Book
    inHandsOnly: true
    requireActiveHand: true
    requiresComplex: true
    singleUser: true
    blockSpectators: true
  - type: UserInterface
    interfaces:
      enum.LitanyUiKey.Book:
        type: LitanyBoundUserInterface
  - type: Tag
    tags:
    - Book


- type: entity
  parent: OxydNtBible
  id: OxydNtClergyBible
  name: NeoTheology clergy litany book
  description: A clergy reference book for spoken NeoTheology litanies.

- type: entity
  parent: BaseStructure
  id: OxydNtAltar
  name: NeoTheology altar
  description: A place for cruciform rites.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/generic.rsi
    state: full
  - type: Icon
    sprite: Structures/Furniture/Tables/generic.rsi
    state: full
  - type: NeoTheologyAltar
  - type: LitanyMachine
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        mask:
        - TableMask
  - type: Strap
    position: Down
    rotation: -90
  - type: InteractionOutline

- type: entity
  parent: Airlock
  id: OxydNtHolyDoor
  name: NeoTheology holy door
  description: A door secured by NeoTheology clearance.
  components:
  - type: NeoTheologyDoor
    minimumClearance: Common
  - type: LitanyMachine

- type: entity
  parent: OxydNtHolyDoor
  id: OxydNtHolyDoorClergy
  name: NeoTheology clergy door
  components:
  - type: NeoTheologyDoor
    minimumClearance: Clergy
  - type: LitanyMachine

- type: entity
  parent: OxydNtHolyDoor
  id: OxydNtHolyDoorPublic
  name: NeoTheology public door
  components:
  - type: NeoTheologyDoor
    minimumClearance: None
  - type: LitanyMachine

- type: entity
  parent: ClothingNeckGoldmedal
  id: OxydNtTauCross
  name: tau cross
  description: A heavy necklace in the shape of a tau cross. It opens NeoTheology doors.
  components:
  - type: TauCross

# P3.0: Eris's NT OBG ("Holy Grail") is a focused blast (explosion_power = 500). The fork's
# HolyHandGrenade is a macrobomb (totalIntensity 3500) and is also sold in the uplink, so it is
# not retuned in place. This child overrides only the Explosive block; every other field (sprite,
# timer, trigger) is inherited unchanged.
- type: entity
  parent: HolyHandGrenade
  id: OxydNtHolyHandGrenade
  components:
  - type: Explosive
    totalIntensity: 500

# P3.4: the faithful in the Eye's radius are blessed each scan. The blessing's stat benefit is a
# deferred balance decision (see the plan) — this only wires the apply/lapse mechanism, no stat
# change yet.
- type: entity
  parent: MobStatusEffectBase
  id: OxydNtEyeBlessing
  name: eye blessing
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
