# Admin-spawned ghost roles for litany checks. These are not station jobs or map spawns.
# Spawn a marker below after the round starts; its humanoid appears in the ghost-role list.
- type: startingGear
  id: OxydNtLitanyTestGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitChaplain
    shoes: ClothingShoesColorBlack
    belt: OxydNtBible

- type: randomHumanoidSettings
  id: OxydNtLitanyTestBase
  parent: EventHumanoid
  abstract: true
  components:
  - type: GhostRole
    description: Test NeoTheology litanies with a cruciform and a litany book.
    rules: Follow server rules. This role is for litany testing.
  - type: Loadout
    prototypes: [ OxydNtLitanyTestGear ]
    roleLoadout: [ RoleSurvivalStandard ]

- type: entity
  id: RandomHumanoidSpawnerOxydNtDisciple
  name: NeoTheology disciple
  suffix: Litany Test Ghost Role
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    state: chaplain
  - type: RandomHumanoidSpawner
    settings: OxydNtLitanyTestDisciple

- type: randomHumanoidSettings
  id: OxydNtLitanyTestDisciple
  parent: OxydNtLitanyTestBase
  components:
  - type: GhostRole
    name: NeoTheology disciple (litany test)
  - type: NeoTheologyTestRole
    profile: OxydNtDisciple

