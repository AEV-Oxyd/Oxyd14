- type: weightedRandom
  id: RestObjectives
  weights:
    RestObjectivesDrugs: 1

- type: weightedRandom
  id: RestObjectivesFood
  weights:
    RestObjectiveExperienceTasteBread: 1
    RestObjectiveExperienceTasteSweet: 1
    RestObjectiveExperienceTasteSalty: 1
    RestObjectiveExperienceTasteSour: 1
    RestObjectiveExperienceTasteBitter: 1
    RestObjectiveExperienceTasteSpicy: 1
    RestObjectiveExperienceTasteCheese: 1
    RestObjectiveExperienceTasteSmokey: 1

- type: weightedRandom
  id: RestObjectivesDrugs
  weights:
    RestObjectiveMetabolizeReagentDrugs: 1

- type: objectiveIssuer
  id: MentalSelf
  name: Desires

- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseRestObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: MentalSelf
  - type: ObjectiveEventOnComplete
  - type: ObjectiveGiveRest


- type: entity
  parent: BaseRestObjective
  id: RestObjectiveExperienceTasteBread
  name: BreadMuncher
  description: You have a desire for something bready..
  components:
  - type: ExperienceFlavourObjective
    timesToExperience: 5
    flavours:
